<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Las Mejores Trampas del Ajedrez</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chessboard.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
    <style>
        body { font-family: 'Inter', sans-serif; }
        .step-active { background-color: #fef2f2; border-left: 4px solid #ef4444; }
        .scenario-btn.active { background-color: #ef4444; color: white; border-color: #ef4444; }
        .scenario-btn { min-width: max-content; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <nav class="bg-red-600 text-white p-4 shadow-md flex flex-wrap justify-between items-center gap-4">
        <h1 class="text-xl font-bold">Ajedrez Maestro: Trampas Letales</h1>
        <ul class="flex space-x-4">
            <li><a href="index.html" class="hover:underline">Inicio</a></li>
            <li><a href="destruye_apertura.html" class="hover:underline">Destruye aperturas</a></li>
            <li><a href="trampas.html" class="font-bold underline">Top 10 Trampas</a></li>
        </ul>
    </nav>

    <div class="max-w-7xl mx-auto p-4 mt-4 flex gap-2 overflow-x-auto" id="scenario-selector">
        <!-- Generado por JS -->
    </div>

    <div class="max-w-7xl mx-auto p-6 mt-2 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Tablero de Ajedrez -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center">
            <h2 id="scenario-title" class="text-2xl font-bold mb-4 text-center text-red-600">Cargando...</h2>
            
            <div class="w-full max-w-[400px] mb-6">
                <div id="board" class="w-full"></div>
            </div>

            <div class="flex gap-4">
                <button id="btn-prev" class="px-6 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-lg transition-colors">
                    &laquo; Anterior
                </button>
                <button id="btn-next" class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition-colors shadow-sm">
                    Siguiente &raquo;
                </button>
            </div>
        </div>

        <!-- Explicación Paso a Paso -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 class="text-xl font-bold mb-4 border-b pb-2">Secuencia y Explicación</h3>
            
            <div id="steps-container" class="flex flex-col gap-3 max-h-[500px] overflow-y-auto pr-2">
                <!-- Se llena con JS -->
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script>
      const traps = {
        ark: {
          title: "1. Arca de Noé",
          pgn: "1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Ba4 d6 5. d4 b5 6. Bb3 Nxd4 7. Nxd4 exd4 8. Qxd4 c5 9. Qd5 Be6 10. Qc6+ Bd7 11. Qd5 c4",
          steps: [
            { title: "Defensa Ruy López", text: "Las negras juegan la variante Steinitz Diferida." },
            { title: "El cebo (exd4)", text: "Las blancas retoman con la dama en d4, lo que parece normal, pero es el inicio de la trampa." },
            { title: "Amenaza sobre la dama", text: "Las negras juegan c5, amenazando la dama blanca y preparando el avance c4." },
            { title: "El ataque a la torre", text: "La dama blanca va a d5 para atacar la torre de a8, obligando a las negras a jugar Ae6." },
            { title: "El Arca de Noé", text: "Tras Qc6+ Bd7 Qd5, las negras juegan ¡c4! y el alfil de casillas claras de las blancas está atrapado." }
          ],
          milestones: [0, 14, 16, 18, 21]
        },
        legal: {
          title: "2. Mate de Légal",
          pgn: "1. e4 e5 2. Nf3 Nc6 3. Bc4 d6 4. Nc3 Bg4 5. h3 Bh5 6. Nxe5 Bxd1 7. Bxf7+ Ke7 8. Nd5#",
          steps: [
            { title: "Apertura Italiana", text: "Un desarrollo clásico. Las negras clavan el caballo blanco de f3 con Ag4." },
            { title: "Cuestionando al alfil", text: "Las blancas juegan h3. Si las negras retiran el alfil a h5, ¡caen en la trampa!" },
            { title: "El sacrificio de Dama", text: "¡Nxe5! Las blancas ignoran la clavada y sacrifican su dama. Si las negras la capturan, están perdidas." },
            { title: "El Mate de Légal", text: "Las blancas rematan con un precioso jaque mate usando sus dos caballos y el alfil." }
          ],
          milestones: [0, 9, 11, 15]
        },
        elephant: {
          title: "3. Trampa Elefante",
          pgn: "1. d4 d5 2. c4 e6 3. Nc3 Nf6 4. Bg5 Nbd7 5. cxd5 exd5 6. Nxd5 Nxd5 7. Bxd8 Bb4+ 8. Qd2 Bxd2+ 9. Kxd2 Kxd8",
          steps: [
            { title: "Gambito de Dama Rehusado", text: "Las negras plantean un esquema sólido. Las blancas clavan el caballo de f6." },
            { title: "El Peón Envenenado", text: "Las blancas cambian en d5 y juegan Nxd5, creyendo que el caballo de f6 está clavado por el alfil de g5. ¡Pero es una trampa!" },
            { title: "Sacrificio temporal", text: "Las negras ignoran la clavada y juegan Nxd5, permitiendo que las blancas capturen su dama en d8." },
            { title: "La Trampa se Cierra", text: "¡Bb4+! El rey blanco no tiene escapatoria y debe entregar la dama con Qd2. Al final, las negras ganan una pieza limpia." }
          ],
          milestones: [0, 11, 13, 17]
        },
        lasker: {
          title: "4. Trampa Lasker",
          pgn: "1. d4 d5 2. c4 e5 3. dxe5 d4 4. e3 Bb4+ 5. Bd2 dxe3 6. Bxb4 exf2+ 7. Ke2 fxg1=N+ 8. Ke1 Qh4+",
          steps: [
            { title: "Contragambito Albin", text: "Las negras sacrifican un peón para obtener un peón avanzado en d4 muy molesto." },
            { title: "El Error Blanco", text: "Las blancas juegan e3 para romper el centro, pero permiten una secuencia táctica brillante." },
            { title: "Sacrificio de Alfil", text: "Las negras juegan dxe3! permitiendo que las blancas coman su alfil en b4." },
            { title: "La Promoción Menor", text: "En lugar de coronar una dama (que permitiría cambiar damas), las negras coronan un caballo con jaque, destruyendo la posición blanca." }
          ],
          milestones: [0, 7, 11, 14]
        },
        rubinstein: {
          title: "5. Trampa Rubinstein",
          pgn: "1. d4 d5 2. c4 e6 3. Nc3 Nf6 4. Bg5 Be7 5. e3 O-O 6. Nf3 Nbd7 7. Rc1 c6 8. Qc2 a6 9. cxd5 exd5 10. Bd3 Re8 11. O-O Ne4 12. Bf4 f5 13. Nxd5 cxd5 14. Bc7",
          steps: [
            { title: "Posición Ortodoxa", text: "Se ha llegado a una posición normal del Gambito de Dama. Las blancas han completado el desarrollo." },
            { title: "El Caballo a e4", text: "Las negras saltan con Ne4. Parece fuerte, pero oculta un fallo estructural que las blancas explotarán." },
            { title: "El Error de f5", text: "Las negras defienden su caballo con f5. Esto abre diagonales peligrosas y abandona la protección de ciertas casillas." },
            { title: "El Castigo", text: "Las blancas sacrifican el caballo temporalmente en d5. Si las negras retoman, Bc7 encierra por completo a la dama negra." }
          ],
          milestones: [0, 21, 24, 27]
        },
        siberian: {
          title: "6. Trampa Siberiana",
          pgn: "1. e4 c5 2. d4 cxd4 3. c3 dxc3 4. Nxc3 Nc6 5. Nf3 e6 6. Bc4 Qc7 7. O-O Nf6 8. Qe2 Ng4 9. h3 Nd4",
          steps: [
            { title: "Gambito Smith-Morra", text: "Las blancas entregan un peón para desarrollar rápido sus piezas contra la Siciliana." },
            { title: "El desarrollo negro", text: "Las negras desarrollan sus piezas normalmente. Qc7 y Nf6 parecen naturales." },
            { title: "La Maniobra Ng4", text: "El caballo salta a g4. Las blancas, molestadas, lo atacan con h3 sin ver el verdadero peligro." },
            { title: "¡El Golpe Letal!", text: "¡Nd4! Ataca a la dama blanca y amenaza Nxe2. Si las blancas juegan Nxd4, las negras responden Qh2#." }
          ],
          milestones: [0, 12, 16, 18]
        },
        fajarowicz: {
          title: "7. Trampa Fajarowicz",
          pgn: "1. d4 Nf6 2. c4 e5 3. dxe5 Ne4 4. a3 d6 5. exd6 Bxd6 6. g3 Nxf2 7. Kxf2 Bxg3+ 8. hxg3 Qxd1",
          steps: [
            { title: "Gambito Budapest", text: "Las negras sacrifican el peón de e5. Al saltar a e4 en vez de g4, plantean la trampa Fajarowicz." },
            { title: "El desarrollo blanco", text: "Las blancas juegan a3 para evitar Bb4+ y luego cambian en d6, creyéndose seguras." },
            { title: "El Sacrificio de Caballo", text: "¡Nxf2! Sacrificio espectacular que atrae al rey blanco a una casilla vulnerable." },
            { title: "El Jaque Descubierto", text: "¡Bxg3+! El rey blanco no tiene más remedio que moverse, y la dama blanca en d1 queda indefensa." }
          ],
          milestones: [0, 9, 12, 15]
        },
        blackburne: {
          title: "8. Blackburne Shilling",
          pgn: "1. e4 e5 2. Nf3 Nc6 3. Bc4 Nd4 4. Nxe5 Qg5 5. Nxf7 Qxg2 6. Rf1 Qxe4+ 7. Be2 Nf3#",
          steps: [
            { title: "El Cebo", text: "En plena Apertura Italiana, las negras juegan Nd4. Es una aparente metedura de pata que deja el peón de e5 libre." },
            { title: "Ataque doble", text: "Las blancas muerden el anzuelo y comen en e5 amenazando f7, pero la Dama negra salta a g5 atacando al caballo y al peón de g2." },
            { title: "La Codicia Blanca", text: "Las blancas capturan en f7 amenazando la torre. Las negras ignoran esto y comen en g2 amenazando la torre blanca." },
            { title: "Mate Asfixiado", text: "Tras Rf1 y Qxe4+, las blancas deben bloquear con el alfil, permitiendo un hermoso mate de la coz con Nf3#." }
          ],
          milestones: [0, 5, 8, 14]
        },
        englund: {
          title: "9. Gambito Englund",
          pgn: "1. d4 e5 2. dxe5 Nc6 3. Nf3 Qe7 4. Bf4 Qb4+ 5. Bd2 Qxb2 6. Bc3 Bb4 7. Qd2 Bxc3 8. Qxc3 Qc1#",
          steps: [
            { title: "Gambito Englund", text: "Las negras desafían d4 directamente con e5 y luego atacan el peón central con caballo y dama." },
            { title: "Ataque a la Dama", text: "Las blancas defienden e5 con el alfil, pero las negras dan jaque en b4 atacando el rey, el alfil y el peón de b2 a la vez." },
            { title: "La captura de la torre", text: "Las negras capturan en b2. Las blancas creen atrapar la dama con Bc3, pero..." },
            { title: "El Mate Inesperado", text: "Tras la clavada Bb4, las blancas pierden la ventaja y, si capturan el alfil de forma descuidada, ¡reciben jaque mate de la dama en c1!" }
          ],
          milestones: [0, 7, 11, 16]
        },
        fishing: {
          title: "10. Caña de Pescar",
          pgn: "1. e4 e5 2. Nf3 Nc6 3. Bb5 Nf6 4. O-O Ng4 5. h3 h5 6. hxg4 hxg4 7. Ne1 Qh4 8. f3 g3",
          steps: [
            { title: "Defensa Berlinesa", text: "Las negras juegan una línea de apariencia normal contra la Ruy López." },
            { title: "La Caña de Pescar", text: "Ng4! El caballo se coloca agresivamente. Cuando las blancas lo atacan con h3, las negras lo defienden 'sin querer' con h5." },
            { title: "El Cebo es Mordido", text: "Si las blancas capturan el caballo (hxg4), la columna h se abre violentamente para la torre negra." },
            { title: "La Red de Mate", text: "La Dama negra entra en h4 y el peón en g3 sella el ataúd del rey blanco. ¡El mate es inevitable!" }
          ],
          milestones: [0, 8, 12, 16]
        }
      };

      let currentScenarioId = 'ark';
      let currentStepIndex = 0;
      let engine = new Chess();
      let board = null;

      function renderSelector() {
          const container = document.getElementById('scenario-selector');
          container.innerHTML = '';
          Object.keys(traps).forEach(key => {
              const btn = document.createElement('button');
              btn.className = `scenario-btn px-4 py-2 bg-white border border-slate-300 rounded-lg shadow-sm hover:bg-slate-100 transition-colors font-semibold text-sm ${key === currentScenarioId ? 'active' : ''}`;
              btn.textContent = traps[key].title;
              btn.onclick = () => loadScenario(key);
              container.appendChild(btn);
          });
      }

      function renderSteps() {
          const container = document.getElementById('steps-container');
          container.innerHTML = '';
          const scenario = traps[currentScenarioId];
          
          scenario.steps.forEach((step, idx) => {
              const stepDiv = document.createElement('div');
              stepDiv.className = `p-4 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 transition-colors ${idx === currentStepIndex ? 'step-active' : ''}`;
              stepDiv.onclick = () => goToStep(idx);
              stepDiv.innerHTML = `
                  <h4 class="font-bold text-slate-800 mb-1">Paso ${idx + 1}: ${step.title}</h4>
                  <p class="text-sm text-slate-600">${step.text}</p>
              `;
              container.appendChild(stepDiv);
          });
          
          document.getElementById('btn-prev').disabled = currentStepIndex === 0;
          document.getElementById('btn-next').disabled = currentStepIndex === scenario.steps.length - 1;
      }

      function loadScenario(id) {
          currentScenarioId = id;
          currentStepIndex = 0;
          
          const scenario = traps[currentScenarioId];
          document.getElementById('scenario-title').textContent = scenario.title;
          
          engine.load_pgn(scenario.pgn);
          renderSelector();
          updateBoardToCurrentStep();
          renderSteps();
      }

      function goToStep(idx) {
          currentStepIndex = idx;
          updateBoardToCurrentStep();
          renderSteps();
      }

      function updateBoardToCurrentStep() {
          const scenario = traps[currentScenarioId];
          const targetMoves = scenario.milestones[currentStepIndex];
          
          const tempEngine = new Chess();
          const moves = engine.history();
          
          for(let i=0; i < targetMoves; i++) {
              if (moves[i]) tempEngine.move(moves[i]);
          }
          
          board.position(tempEngine.fen(), true);
      }

      // Init
      $(document).ready(function() {
          board = Chessboard('board', {
              position: 'start',
              pieceTheme: 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0/wikipedia/{piece}.png'
          });

          loadScenario('ark');

          $('#btn-prev').click(() => {
              if (currentStepIndex > 0) goToStep(currentStepIndex - 1);
          });
          $('#btn-next').click(() => {
              const scenario = traps[currentScenarioId];
              if (currentStepIndex < scenario.steps.length - 1) goToStep(currentStepIndex + 1);
          });
      });
    </script>
</body>
</html>
